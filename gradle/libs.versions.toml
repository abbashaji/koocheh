# Koocheh version catalog.
# No networking, analytics, or telemetry dependencies belong here.

[versions]
kotlin = "2.0.21" # [UNVERIFIED] check before first build
agp = "8.7.2" # [UNVERIFIED] check before first build
coroutines = "1.9.0" # [UNVERIFIED] check before first build
serialization = "1.7.3" # [UNVERIFIED] check before first build
compose-bom = "2024.10.01" # [UNVERIFIED] check before first build
androidx-core = "1.13.1" # [UNVERIFIED] check before first build
androidx-activity = "1.9.3" # [UNVERIFIED] check before first build
androidx-lifecycle = "2.8.7" # [UNVERIFIED] check before first build
androidx-navigation = "2.8.3" # [UNVERIFIED] check before first build
room = "2.6.1" # [UNVERIFIED] check before first build
sqlcipher = "4.5.4" # [UNVERIFIED] check before first build
lazysodium = "5.1.0" # [UNVERIFIED] check before first build
jna = "5.14.0" # [UNVERIFIED] check before first build
zxing = "3.5.3" # [UNVERIFIED] check before first build
junit = "4.13.2" # [UNVERIFIED] check before first build
turbine = "1.1.0" # [UNVERIFIED] check before first build

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlcipher-android = { module = "net.zetetic:android-database-sqlcipher", version.ref = "sqlcipher" }
lazysodium-android = { module = "com.goterl:lazysodium-android", version.ref = "lazysodium" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
