    kind: implementation
    contract: |
      org.koocheh.crypto EphemeralIdProvider, Commitments, Signer, SecureSessionFactory, SecureSession, ContextSecretSource.
  - from: C-005
    kind: implementation
    contract: |
      org.koocheh.psi PsiEngine, PsiSession, RevealLevel, FakePsiEngine in testFixtures.
  - from: C-006
    kind: implementation
    contract: |
      org.koocheh.storage KeyVault, UnlockResult, SecureStore, ContextStore.
  - from: C-007
    kind: implementation
    contract: |
      org.koocheh.transport DiscoveryService, PeerLink, PeerChannel.
  - from: C-008
    kind: implementation
    contract: |
      org.koocheh.disclosure DisclosureEngine, DisclosureSession, TierState.
  - from: C-009
    kind: implementation
    contract: |
      org.koocheh.familiar FamiliarTracker, EncounterLinker.
  - from: C-010
    kind: implementation
    contract: |
      org.koocheh.security DecoyGate, PanicWipe, SecureWindowPolicy, NotificationPolicy, PhotoSanitizer.
  - from: C-011
    kind: implementation
    contract: |
      org.koocheh.invites InviteIssuer, InviteVerifier, QrCodec.
  - from: C-012
    kind: implementation
    contract: |
      org.koocheh.chat ChatService.
  - from: C-014
    kind: implementation
    contract: |
      UI screens for onboarding, lock, profile and settings exist under org.koocheh.ui.
  - from: C-015
    kind: implementation
    contract: |
      UI screens for signals, disclosure, chat and AppNavHost exist under org.koocheh.ui.
  - from: C-016
    kind: implementation
    contract: |
      org.koocheh.pilot PilotRecorder, PilotExporter, ExperimentFlags.
outputs:
  - app/build.gradle.kts
  - app/src/main/kotlin/org/koocheh/ServiceLocator.kt
  - app/src/test/kotlin/org/koocheh/integration/FakeRadioLink.kt
  - app/src/test/kotlin/org/koocheh/integration/TwoPeerFlowTest.kt
  - app/src/test/kotlin/org/koocheh/integration/ContextIsolationTest.kt
  - app/src/test/kotlin/org/koocheh/integration/WipeAndDecoyTest.kt
acceptance:
  - cmd: test -f app/src/test/kotlin/org/koocheh/integration/TwoPeerFlowTest.kt
  - cmd: grep -q modules/disclosure app/build.gradle.kts
  - cmd: grep -q reproducible app/build.gradle.kts
  - cmd: sh -c '! grep -q NotWiredYet app/src/main/kotlin/org/koocheh/ServiceLocator.kt'
